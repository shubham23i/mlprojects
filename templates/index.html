<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Student Math Score Predictor</title>

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

<style>
body{
background: linear-gradient(120deg,#667eea,#764ba2);
height:100vh;
display:flex;
align-items:center;
justify-content:center;
font-family:Arial;
}

.container-box{
background:white;
padding:40px;
border-radius:15px;
box-shadow:0px 10px 30px rgba(0,0,0,0.2);
width:600px;
}

h2{
text-align:center;
margin-bottom:25px;
}

.btn-primary{
width:100%;
font-size:18px;
}

.result{
margin-top:20px;
text-align:center;
font-size:22px;
font-weight:bold;
color:#4CAF50;
}
</style>
</head>

<body>

<div class="container-box">

<h2>🎓 Student Math Score Prediction</h2>

<form action="/predict" method="post">

<div class="mb-3">
<label class="form-label">Gender</label>
<select class="form-control" name="gender">
<option value="male">Male</option>
<option value="female">Female</option>
</select>
</div>

<div class="mb-3">
<label class="form-label">Race / Ethnicity</label>
<select class="form-control" name="race">
<option value="group A">Group A</option>
<option value="group B">Group B</option>
<option value="group C">Group C</option>
<option value="group D">Group D</option>
<option value="group E">Group E</option>
</select>
</div>

<div class="mb-3">
<label class="form-label">Parental Education</label>
<select class="form-control" name="education">
<option value="some high school">Some High School</option>
<option value="high school">High School</option>
<option value="some college">Some College</option>
<option value="associate's degree">Associate Degree</option>
<option value="bachelor's degree">Bachelor Degree</option>
<option value="master's degree">Master Degree</option>
</select>
</div>

<div class="mb-3">
<label class="form-label">Lunch Type</label>
<select class="form-control" name="lunch">
<option value="standard">Standard</option>
<option value="free/reduced">Free/Reduced</option>
</select>
</div>

<div class="mb-3">
<label class="form-label">Test Preparation Course</label>
<select class="form-control" name="prep">
<option value="none">None</option>
<option value="completed">Completed</option>
</select>
</div>

<div class="mb-3">
<label class="form-label">Reading Score</label>
<input type="number" class="form-control" name="reading" required>
</div>

<div class="mb-3">
<label class="form-label">Writing Score</label>
<input type="number" class="form-control" name="writing" required>
</div>

<button type="submit" class="btn btn-primary">
Predict Math Score
</button>

</form>

<div class="result">
{{ prediction_text }}
</div>

</div>

</body>
</html>
